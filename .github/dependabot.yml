version: 2
updates:
  # Python backend (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    ignore:
      # torch pins its CUDA wheels and triton to exact versions, so bumping
      # them in constraints.txt makes pip resolution impossible and breaks the
      # Docker build. These versions belong to torch, not to this repo — they
      # move when torch moves. See PR #66.
      - dependency-name: "nvidia-*"
      - dependency-name: "cuda-*"
      - dependency-name: "triton"

  # Next.js frontend (web/package.json)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  # Backend container image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # Frontend container image
  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
